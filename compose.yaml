name: relay

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - relay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - relay_private

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://relay:${POSTGRES_PASSWORD}@postgres:5432/relay
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - relay_private

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://relay:${POSTGRES_PASSWORD}@postgres:5432/relay
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      APP_URL: ${APP_URL:-http://localhost:3000}
      BETTER_AUTH_URL: ${APP_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      RELAY_SETUP_TOKEN: ${RELAY_SETUP_TOKEN:-}
    ports:
      - "${RELAY_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - relay_private

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://relay:${POSTGRES_PASSWORD}@postgres:5432/relay
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      TOKEN_REFRESH_INTERVAL_MS: ${TOKEN_REFRESH_INTERVAL_MS:-300000}
      PUBLISH_INTERVAL_MS: ${PUBLISH_INTERVAL_MS:-5000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - relay_private

volumes:
  relay_postgres_data:

networks:
  relay_private:
