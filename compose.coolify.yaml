services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
    volumes:
      - relay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    build:
      context: .
      target: migrator
    exclude_from_hc: true
    environment:
      DATABASE_URL: postgresql://relay:${POSTGRES_PASSWORD}@postgres:5432/relay
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:?Set APP_URL in Coolify}
      BETTER_AUTH_URL: ${APP_URL:?Set APP_URL in Coolify}
      DATABASE_URL: postgresql://relay:${POSTGRES_PASSWORD}@postgres:5432/relay
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in Coolify}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      RELAY_SETUP_TOKEN: ${RELAY_SETUP_TOKEN:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in Coolify}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?Set R2_ACCOUNT_ID in Coolify}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID in Coolify}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY in Coolify}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-relay-media}
      R2_REGION: ${R2_REGION:-auto}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_RESOLVED_IP: ${R2_RESOLVED_IP:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:?Set R2_PUBLIC_URL in Coolify}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v23.0}
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:?Set APP_URL in Coolify}
      DATABASE_URL: postgresql://relay:${POSTGRES_PASSWORD}@postgres:5432/relay
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in Coolify}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v23.0}
      TOKEN_REFRESH_INTERVAL_MS: ${TOKEN_REFRESH_INTERVAL_MS:-300000}
      PUBLISH_INTERVAL_MS: ${PUBLISH_INTERVAL_MS:-5000}
      ANALYTICS_INTERVAL_MS: ${ANALYTICS_INTERVAL_MS:-60000}
      HEALTH_INTERVAL_MS: ${HEALTH_INTERVAL_MS:-30000}
      REPORT_INTERVAL_MS: ${REPORT_INTERVAL_MS:-3600000}
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  relay_postgres_data:
